name: Private FitPro Android Build

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fitpro-android-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout SmtpClient submodule
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout qHttpServer
        uses: actions/checkout@v4
        with:
          repository: qt-labs/qthttpserver
          path: "src/qthttpserver"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Python 3.10 and distutils
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.10 python3.10-dev python3.10-distutils python3-pip

      - name: Install Qt 5.15.2 Android Toolchain
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android_armeabi_v7a'
          modules: 'qtnetworkauth qtcharts'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          cache: 'true'

      - name: Build qHttpServer for Android ARMv7
        run: |
          cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/
          export ANDROID_NDK_ROOT="${{ env.ANDROID_NDK_ROOT }}"
          export QT_ROOT="${{ github.workspace }}/qt/5.15.2/android"
          cd src/qthttpserver
          "$QT_ROOT/bin/qmake"
          make -j$(nproc)
          make install
          cd ../..

      - name: Compile FitPro USB-HID Android APK (No Trial Flag)
        run: |
          export QT_ROOT="${{ github.workspace }}/qt/5.15.2/android"
          export PYTHON_EXECUTABLE="/usr/bin/python3.10"
          export PATH="/usr/bin:$PATH"
          cd src
          "$QT_ROOT/bin/qmake" qdomyos-zwift.pro \
            -spec android-clang \
            ANDROID_ABIS="armeabi-v7a" \
            "DEFINES+=FITPRO"
          make -j$(nproc)
          make install INSTALL_ROOT=android-build
          "$QT_ROOT/bin/androiddeployqt" \
            --input android-qdomyos-zwift-deployment-settings.json \
            --output android-build \
            --android-platform android-33 \
            --gradle
          cd ..

      - name: Archive Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitpro-android-apk
          path: src/android-build/build/outputs/apk/debug/android-build-debug.apk
