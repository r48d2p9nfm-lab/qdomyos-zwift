name: Private FitPro Android Build

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fitpro-android-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout SmtpClient submodule
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout qHttpServer
        uses: actions/checkout@v4
        with:
          repository: qt-labs/qthttpserver
          path: "src/qthttpserver"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies & Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.10 python3.10-dev python3.10-distutils python3-pip \
            qt5-qmake qtbase5-dev libqt5svg5-dev \
            android-sdk adb

      - name: Build qHttpServer
        run: |
          cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/ || true
          cd src/qthttpserver
          qmake
          make -j$(nproc)
          make install
          cd ../..

      - name: Compile FitPro USB-HID Android APK (No Trial Flag)
        run: |
          cd src
          qmake qdomyos-zwift.pro \
            -spec android-clang \
            ANDROID_ABIS="armeabi-v7a" \
            "DEFINES+=FITPRO"
          make -j$(nproc)
          make install INSTALL_ROOT=android-build
          androiddeployqt \
            --input android-qdomyos-zwift-deployment-settings.json \
            --output android-build \
            --android-platform android-33 \
            --gradle
          cd ..

      - name: Archive Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitpro-android-apk
          path: src/android-build/build/outputs/apk/debug/android-build-debug.apk
